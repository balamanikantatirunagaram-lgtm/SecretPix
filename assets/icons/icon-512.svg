<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bgGrad512" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#52796F" />
      <stop offset="100%" stop-color="#354F46" />
    </linearGradient>
    <linearGradient id="accentGrad512" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#DCE8C8" />
      <stop offset="100%" stop-color="#CADFD1" />
    </linearGradient>
    <filter id="subtleShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#202923" flood-opacity="0.15" />
    </filter>
  </defs>
  <!-- Background -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad512)" />

  <!-- Stego Pixel Matrix Accent -->
  <rect x="96" y="96" width="40" height="40" rx="10" fill="url(#accentGrad512)" opacity="0.35" />
  <rect x="150" y="96" width="40" height="40" rx="10" fill="url(#accentGrad512)" opacity="0.6" />
  <rect x="96" y="150" width="40" height="40" rx="10" fill="url(#accentGrad512)" opacity="0.6" />
  <rect x="376" y="376" width="40" height="40" rx="10" fill="url(#accentGrad512)" opacity="0.4" />
  <rect x="322" y="376" width="40" height="40" rx="10" fill="url(#accentGrad512)" opacity="0.7" />
  <rect x="376" y="322" width="40" height="40" rx="10" fill="url(#accentGrad512)" opacity="0.7" />

  <!-- Central Padlock with Filter -->
  <g filter="url(#subtleShadow)">
    <!-- Shackle -->
    <path d="M192 236V176a64 64 0 0 1 128 0v60" fill="none" stroke="#FFFFFF" stroke-width="32" stroke-linecap="round" />
    <!-- Lock Body -->
    <rect x="144" y="236" width="224" height="172" rx="40" fill="#FFFFFF" />
    <!-- Keyhole -->
    <circle cx="256" cy="308" r="18" fill="#354F46" />
    <rect x="248" y="316" width="16" height="42" rx="8" fill="#354F46" />
  </g>
</svg>
