<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SecretPix — Automated Test Runner</title>
  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/components.css">
  <style>
    body {
      padding: var(--space-8) var(--space-4);
      max-width: 900px;
      margin: 0 auto;
    }
    .test-header {
      margin-bottom: var(--space-6);
      text-align: center;
    }
    .test-card {
      margin-bottom: var(--space-4);
      border-left: 4px solid var(--color-border);
      transition: all var(--transition-fast);
    }
    .test-card.passed {
      border-left-color: var(--color-success);
    }
    .test-card.failed {
      border-left-color: var(--color-error);
    }
    .test-title {
      font-size: var(--text-base);
      font-weight: var(--font-semibold);
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: var(--space-1);
    }
    .test-log {
      font-family: var(--font-mono);
      font-size: var(--text-xs);
      color: var(--color-text-secondary);
      background: var(--color-surface-alt);
      padding: var(--space-3);
      border-radius: var(--radius-sm);
      margin-top: var(--space-2);
      white-space: pre-wrap;
    }
    .summary-card {
      display: flex;
      justify-content: space-around;
      text-align: center;
      margin-bottom: var(--space-8);
      background: linear-gradient(135deg, var(--color-surface) 0%, var(--color-mint-light) 100%);
      border: 1px solid var(--color-mint);
    }
    .summary-metric {
      font-size: var(--text-3xl);
      font-weight: var(--font-bold);
      color: var(--color-primary-dark);
    }
    .summary-label {
      font-size: var(--text-xs);
      color: var(--color-text-secondary);
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
  </style>
</head>
<body>

  <div class="test-header">
    <span class="badge badge-mint" style="margin-bottom: 0.5rem;">Automated Verification</span>
    <h1>SecretPix Test Suite</h1>
    <p>Comprehensive client-side verification for Web Crypto, Canvas API, and Steganography.</p>
  </div>

  <div class="card summary-card" id="summaryCard">
    <div>
      <div class="summary-metric" id="totalCount">0</div>
      <div class="summary-label">Total Tests</div>
    </div>
    <div>
      <div class="summary-metric" style="color: var(--color-success);" id="passCount">0</div>
      <div class="summary-label">Passed</div>
    </div>
    <div>
      <div class="summary-metric" style="color: var(--color-error);" id="failCount">0</div>
      <div class="summary-label">Failed</div>
    </div>
    <div>
      <div class="summary-metric" id="statusBadge">—</div>
      <div class="summary-label">Status</div>
    </div>
  </div>

  <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem;">
    <h2 style="font-size: var(--text-lg);">Test Results</h2>
    <div>
      <button class="btn btn-primary btn-sm" id="rerunBtn">Re-run All Tests</button>
      <a href="index.html" class="btn btn-outline btn-sm" style="margin-left: 8px;">Back to App</a>
    </div>
  </div>

  <div id="resultsContainer"></div>

  <!-- Test Runner Script -->
  <script type="module">
    import { encryptMessage, decryptMessage, getRandomBytes, padBytes, unpadBytes, InvalidPasswordError, CryptoError } from './js/crypto.js';
    import { calculateCapacity, validateImageFile, extractImageDataFromImage, ImageProcessingError } from './js/image.js';
    import {
      createHeader,
      packPayload,
      unpackPayload,
      embedPayloadInImageData,
      extractPayloadFromImageData,
      detectSecretPixHeader,
      NoSecretPixDataError,
      CapacityExceededError
    } from './js/steganography.js';
    import { CONFIG } from './js/config.js';

    const container = document.getElementById('resultsContainer');
    let total = 0;
    let passed = 0;
    let failed = 0;

    function renderTestResult(title, success, logText = '') {
      total++;
      if (success) passed++;
      else failed++;

      const card = document.createElement('div');
      card.className = `card test-card ${success ? 'passed' : 'failed'}`;

      card.innerHTML = `
        <div class="test-title">
          <span>${title}</span>
          <span class="badge ${success ? 'badge-success' : 'badge-error'}">${success ? 'PASSED' : 'FAILED'}</span>
        </div>
        ${logText ? `<div class="test-log">${logText}</div>` : ''}
      `;
      container.appendChild(card);

      document.getElementById('totalCount').textContent = total;
      document.getElementById('passCount').textContent = passed;
      document.getElementById('failCount').textContent = failed;

      const statusBadge = document.getElementById('statusBadge');
      if (failed === 0) {
        statusBadge.textContent = '100%';
        statusBadge.style.color = 'var(--color-success)';
      } else {
        statusBadge.textContent = `${Math.round((passed / total) * 100)}%`;
        statusBadge.style.color = 'var(--color-error)';
      }
    }

    async function executeAllTests() {
      container.innerHTML = '';
      total = 0;
      passed = 0;
      failed = 0;

      // Test 1: Random Salt & IV Generation
      try {
        const salt = getRandomBytes(16);
        const iv = getRandomBytes(12);
        const isFresh = salt.length === 16 && iv.length === 12;
        renderTestResult('Test 1: CSPRNG Random Salt & IV Generation', isFresh, `Generated 16-byte salt and 12-byte IV using window.crypto.getRandomValues().`);
      } catch (e) {
        renderTestResult('Test 1: CSPRNG Random Salt & IV Generation', false, e.message);
      }

      // Test 2: AES-256-GCM + PBKDF2 (600,000 iterations)
      try {
        const secret = 'SecretPix in-browser automated verification string.';
        const pwd = 'TestPassword!2026';
        const { ciphertext, salt, iv } = await encryptMessage(secret, pwd);
        const decrypted = await decryptMessage(ciphertext, salt, iv, pwd);
        const match = decrypted === secret;
        renderTestResult('Test 2: AES-256-GCM + PBKDF2 (600k rounds) Round-Trip', match, `Encrypted ${secret.length} chars to ${ciphertext.length} bytes ciphertext. Decrypted text matches original.`);
      } catch (e) {
        renderTestResult('Test 2: AES-256-GCM + PBKDF2 (600k rounds) Round-Trip', false, e.message);
      }

      // Test 3: Rejection on Incorrect Password
      try {
        const secret = 'Secret Message';
        const { ciphertext, salt, iv } = await encryptMessage(secret, 'CorrectPassword');
        let rejected = false;
        try {
          await decryptMessage(ciphertext, salt, iv, 'WrongPassword');
        } catch (err) {
          if (err instanceof InvalidPasswordError) rejected = true;
        }
        renderTestResult('Test 3: Wrong Password Rejection (GCM Authentication)', rejected, `Decryption with incorrect password failed authentication as expected.`);
      } catch (e) {
        renderTestResult('Test 3: Wrong Password Rejection (GCM Authentication)', false, e.message);
      }

      // Test 4: Ciphertext Tampering Detection (1 bit flip)
      try {
        const secret = 'Tamper Verification';
        const { ciphertext, salt, iv } = await encryptMessage(secret, 'Pass1234!');
        const tampered = new Uint8Array(ciphertext);
        tampered[0] ^= 0x01; // flip 1 bit
        let caught = false;
        try {
          await decryptMessage(tampered, salt, iv, 'Pass1234!');
        } catch (err) {
          if (err instanceof InvalidPasswordError) caught = true;
        }
        renderTestResult('Test 4: Tampering Detection (Single Bit Flip)', caught, `1-bit modification in ciphertext triggered immediate authentication rejection.`);
      } catch (e) {
        renderTestResult('Test 4: Tampering Detection (Single Bit Flip)', false, e.message);
      }

      // Test 5: Unicode, Multiline, and Emojis
      try {
        const unicodeSecret = '🔒 SecretPix: 秘密メッセージ! \nAccent: Crème brûlée 🌟 \nMath: π ≈ 3.14159';
        const pwd = 'UnicodeP@ssword!';
        const { ciphertext, salt, iv } = await encryptMessage(unicodeSecret, pwd);
        const decrypted = await decryptMessage(ciphertext, salt, iv, pwd);
        renderTestResult('Test 5: Multi-byte Unicode, Emojis & Multiline Text', decrypted === unicodeSecret, `Decrypted text exactly matches all emojis, accents, and symbols.`);
      } catch (e) {
        renderTestResult('Test 5: Multi-byte Unicode, Emojis & Multiline Text', false, e.message);
      }

      // Test 6: Capacity Calculation Engine
      try {
        const cap = calculateCapacity(1920, 1080, 1000);
        const expectedRaw = Math.floor((1920 * 1080 * 3) / 8);
        const valid = cap.rawCapacityBytes === expectedRaw && cap.usableCapacityBytes === (expectedRaw - 54);
        renderTestResult('Test 6: Capacity Calculation Math (1920 × 1080 Full HD)', valid, `Raw capacity: ${cap.rawCapacityBytes.toLocaleString()} bytes. Usable: ${cap.usableCapacityBytes.toLocaleString()} bytes.`);
      } catch (e) {
        renderTestResult('Test 6: Capacity Calculation Math (1920 × 1080 Full HD)', false, e.message);
      }

      // Test 6B: Image Pixel Dimensions Limit Guard (> 25 Megapixels)
      try {
        let dimBlocked = false;
        try {
          extractImageDataFromImage({ naturalWidth: 7000, naturalHeight: 4000 }); // 28 megapixels
        } catch (err) {
          if (err instanceof ImageProcessingError && err.code === 'DIMENSIONS_TOO_LARGE') {
            dimBlocked = true;
          }
        }
        renderTestResult('Test 6B: Image Dimensions Limit Guard (> 25 MP)', dimBlocked, `Oversized image (7000 × 4000 = 28 MP) successfully rejected with DIMENSIONS_TOO_LARGE.`);
      } catch (e) {
        renderTestResult('Test 6B: Image Dimensions Limit Guard (> 25 MP)', false, e.message);
      }

      // Test 7: Binary Protocol Packing & Unpacking
      try {
        const s = new Uint8Array(16).fill(5);
        const v = new Uint8Array(12).fill(7);
        const c = new Uint8Array(64).fill(9);
        const packed = packPayload(s, v, c);
        const unpacked = unpackPayload(packed);
        const match = unpacked.version === 0x01 && unpacked.ciphertext.length === 64;
        renderTestResult('Test 7: Binary Packet Protocol Serialization (SPIX)', match, `Header verified: SPIX magic bytes, version 0x01, 38-byte header structure.`);
      } catch (e) {
        renderTestResult('Test 7: Binary Packet Protocol Serialization (SPIX)', false, e.message);
      }

      // Test 8: LSB Embedding & Alpha Preservation
      try {
        const width = 60;
        const height = 60;
        const pixelData = new Uint8Array(width * height * 4);
        pixelData.fill(255); // Alpha is 255
        const mockImg = { width, height, data: pixelData };

        const s = new Uint8Array(16).fill(1);
        const v = new Uint8Array(12).fill(2);
        const c = new Uint8Array(30).fill(3);
        const packed = packPayload(s, v, c);

        embedPayloadInImageData(mockImg, packed);

        // Verify Alpha stayed 255
        let alphaIntact = true;
        for (let i = 0; i < width * height; i++) {
          if (mockImg.data[i * 4 + 3] !== 255) {
            alphaIntact = false;
            break;
          }
        }
        renderTestResult('Test 8: LSB Embedding & Alpha Channel Preservation', alphaIntact, `All 3,600 pixels preserved 100% alpha opacity. Zero transparency corruption.`);
      } catch (e) {
        renderTestResult('Test 8: LSB Embedding & Alpha Channel Preservation', false, e.message);
      }

      // Test 9: Fast Header Detection
      try {
        const plainImg = { width: 50, height: 50, data: new Uint8Array(50 * 50 * 4) };
        const plainDetected = detectSecretPixHeader(plainImg);

        const s = new Uint8Array(16);
        const v = new Uint8Array(12);
        const c = new Uint8Array(10);
        embedPayloadInImageData(plainImg, packPayload(s, v, c));
        const encodedDetected = detectSecretPixHeader(plainImg);

        const success = !plainDetected && encodedDetected;
        renderTestResult('Test 9: Fast SPIX Header Scanner', success, `Plain image correctly identified as negative; encoded image detected in first 11 pixels.`);
      } catch (e) {
        renderTestResult('Test 9: Fast SPIX Header Scanner', false, e.message);
      }

      // Test 10: PKCS#7 Length Padding
      try {
        const raw = new Uint8Array([1, 2, 3, 4, 5]);
        const padded = padBytes(raw, 64);
        const unpadded = unpadBytes(padded, 64);
        const padSuccess = padded.length === 64 && unpadded.length === 5;
        renderTestResult('Test 10: PKCS#7 Length Padding (Side-Channel Defense)', padSuccess, `Short 5-byte payload padded to 64 bytes; padding cleanly stripped upon decoding.`);
      } catch (e) {
        renderTestResult('Test 10: PKCS#7 Length Padding (Side-Channel Defense)', false, e.message);
      }

      // Test 11: AEAD Header Tampering Detection
      try {
        const msg = 'AEAD Integrity Guard Test';
        const pwd = 'TestPassword123!';
        const mockSalt = getRandomBytes(16);
        const mockIv = getRandomBytes(12);
        const header = createHeader(mockSalt, mockIv, 80);

        const { ciphertext } = await encryptMessage(msg, pwd, { salt: mockSalt, iv: mockIv, additionalData: header });
        
        let headerTamperCaught = false;
        const tamperedHeader = new Uint8Array(header);
        tamperedHeader[6] ^= 0x01; // flip 1 bit in salt inside header AAD

        try {
          await decryptMessage(ciphertext, mockSalt, mockIv, pwd, tamperedHeader);
        } catch (err) {
          if (err instanceof InvalidPasswordError) headerTamperCaught = true;
        }

        renderTestResult('Test 11: AEAD Header Integrity Binding', headerTamperCaught, `Tampering with salt/IV/length in the header AAD triggers GCM authentication failure.`);
      } catch (e) {
        renderTestResult('Test 11: AEAD Header Integrity Binding', false, e.message);
      }

      // Test 12: Complete End-to-End Workflow Round-Trip
      try {
        const originalMessage = 'SecretPix Full Workflow Verification: 2026 Pass! 🚀';
        const password = 'SuperSecureSecret123!';

        // 1. Calculate padded ciphertext length for header AAD
        const plaintextBytes = new TextEncoder().encode(originalMessage);
        const padLen = 64 - (plaintextBytes.length % 64);
        const paddedLength = plaintextBytes.length + padLen;
        const ciphertextLength = paddedLength + 16;

        const salt = getRandomBytes(16);
        const iv = getRandomBytes(12);
        const header = createHeader(salt, iv, ciphertextLength);

        // 2. Encrypt with AEAD header binding
        const { ciphertext } = await encryptMessage(originalMessage, password, { salt, iv, additionalData: header });

        // 3. Pack
        const payload = packPayload(salt, iv, ciphertext);

        // 4. Synthetic Canvas Image
        const canvas = document.createElement('canvas');
        canvas.width = 120;
        canvas.height = 120;
        const ctx = canvas.getContext('2d');
        ctx.fillStyle = '#52796F';
        ctx.fillRect(0, 0, 120, 120);
        const imgData = ctx.getImageData(0, 0, 120, 120);

        // 5. Embed
        embedPayloadInImageData(imgData, payload);
        ctx.putImageData(imgData, 0, 0);

        // 6. Extract
        const extractedImgData = ctx.getImageData(0, 0, 120, 120);
        const extracted = extractPayloadFromImageData(extractedImgData);

        // 7. Decrypt with AEAD header verification
        const recovered = await decryptMessage(extracted.ciphertext, extracted.salt, extracted.iv, password, extracted.header);

        const match = recovered === originalMessage;
        renderTestResult('Test 12: Full End-to-End Canvas Round-Trip', match, `Full pipeline verified: Message $\\rightarrow$ PKCS#7 $\\rightarrow$ AEAD GCM $\\rightarrow$ Canvas LSB $\\rightarrow$ Extraction $\\rightarrow$ Decryption. Exact match.`);
      } catch (e) {
        renderTestResult('Test 12: Full End-to-End Canvas Round-Trip', false, e.message);
      }
    }

    document.getElementById('rerunBtn').addEventListener('click', executeAllTests);
    executeAllTests();
  </script>
</body>
</html>
